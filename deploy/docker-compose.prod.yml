# Server stack used by .github/workflows/deploy.yml.
# All settings come from .env next to this file (see .env.example). Put HTTPS in
# front of port 3000 (e.g. a load balancer, Caddy or nginx) and set SECURE_COOKIES=true.
# For production prefer a managed PostgreSQL with daily backups kept 30+ days;
# if you use the bundled `db` service, back up the pgdata volume yourself.

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/thecoderas/crptrx:latest}
  init: true
  restart: unless-stopped
  env_file: .env
  volumes:
    - appdata:/app/.data

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usdt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-usdt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usdt}"]
      interval: 5s
      retries: 20

  web:
    <<: *app
    command: ["web"]
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true

volumes:
  pgdata:
  appdata:
