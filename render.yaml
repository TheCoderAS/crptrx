# Render Blueprint for the TEST deployment (Render → New → Blueprint → pick this repo).
# One Docker service runs the website and the blockchain watcher together.
# Database and ID documents live in Supabase; Google sign-in in Firebase.
# Values marked sync: false are asked for when you create the Blueprint.
services:
  - type: web
    name: crptrx-test
    runtime: docker
    plan: starter # the free plan sleeps when idle, which pauses payment detection
    region: singapore # closest Render region to India
    dockerCommand: entrypoint all
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_URL
        sync: false # e.g. https://crptrx-test.onrender.com
      - key: DATABASE_URL
        sync: false # Supabase Session pooler string (see docs/DEPLOY.md)
      # Generated once by Render and kept. Losing ENCRYPTION_KEY makes PAN, bank numbers and 2FA unreadable.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LINK_SIGNING_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SECURE_COOKIES
        value: "true"
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: kyc
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # Test helpers (switched off automatically in Live mode anyway).
      - key: DEV_LOGIN_ENABLED
        value: "true"
      - key: DEV_TOOLS_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: TRONGRID_API_KEY
        sync: false
      - key: BSC_TEST_RPC_URL
        value: https://bsc-testnet-rpc.publicnode.com
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_TEST_DEPOSIT_TRON
        sync: false
      - key: SEED_TEST_DEPOSIT_BSC
        sync: false
