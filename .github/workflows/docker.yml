name: Docker test

# Builds the app's Docker image (the same one Render builds), starts the full
# stack and walks the whole customer/admin flow in a browser. Only checks:
# Render builds and deploys by itself, so nothing is published.
# Runs on release PRs (staging -> main) and by hand (Actions -> Run workflow);
# everyday PRs into staging skip it to save CI time.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: start the exact test-phase stack and walk the full flow in a browser.
      - name: Start stack
        run: |
          APP_IMAGE=app:ci docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/health && break; sleep 2; done
          curl -fs http://localhost:3000/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: End-to-end flow
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node e2e/flow.mjs
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color | tail -300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output/
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
