name: Android build

# Builds, signs, tests and (optionally) publishes the Android app. Called by android.yml
# (pull requests and staging) and release.yml (main). Versions and file names must match
# src/server/appRelease.ts, which tells the app and the /app page where the newest file is:
#   live (main):    release vX.Y.Z             VisionPay-vX.Y.Z.apk              versionCode X*10000+Y*100+Z
#   test (staging): pre-release vX.Y.Z-test.N  VisionPay-Test-vX.Y.Z-test.N.apk  versionCode N
#
# Settings (repository > Settings > Secrets and variables > Actions):
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   variables ANDROID_LIVE_URL, ANDROID_TEST_URL  (the websites the apps open; change them for a new domain)

on:
  workflow_call:
    inputs:
      flavor: { type: string, required: true } # live | staging
      version_name: { type: string, required: true } # 1.3.0 or 1.3.0-test.12
      version_code: { type: string, required: true }
      tag: { type: string, default: "" } # release to attach the file to; empty = don't publish
      create_release: { type: boolean, default: false } # make the (pre-)release instead of adding to an existing one
      require_signing: { type: boolean, default: false }
      smoke_test: { type: boolean, default: true }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIVE_URL: ${{ vars.ANDROID_LIVE_URL || 'https://crptrxapp.onrender.com' }}
      TEST_URL: ${{ vars.ANDROID_TEST_URL || 'https://crptrx-stage.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Names and versions
        id: meta
        run: |
          if [ "${{ inputs.flavor }}" = "live" ]; then
            echo "apk=VisionPay-v${{ inputs.version_name }}.apk" >> "$GITHUB_OUTPUT"
            echo "package=com.visionpay.live.app" >> "$GITHUB_OUTPUT"
            echo "url=$LIVE_URL" >> "$GITHUB_OUTPUT"
            echo "label=VisionPay" >> "$GITHUB_OUTPUT"
          else
            echo "apk=VisionPay-Test-v${{ inputs.version_name }}.apk" >> "$GITHUB_OUTPUT"
            echo "package=com.visionpay.live.app.test" >> "$GITHUB_OUTPUT"
            echo "url=$TEST_URL" >> "$GITHUB_OUTPUT"
            echo "label=VisionPay Test" >> "$GITHUB_OUTPUT"
          fi
          F="${{ inputs.flavor }}"
          echo "task=assemble${F^}Release" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "VP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "VP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "VP_KEY_ALIAS=$KEY_ALIAS"
              echo "VP_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.require_signing }}" = "true" ]; then
            echo "::error title=No signing key::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and ANDROID_KEY_PASSWORD) in Settings > Secrets and variables > Actions. The live app is never published without our key."
            exit 1
          else
            echo "::warning title=Temporary signing key::No signing key in the repository secrets yet, so this app file uses a throwaway key. Phones must uninstall it before installing one signed with the real key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace ${{ steps.meta.outputs.task }} \
            -PvpVersionName="${{ inputs.version_name }}" -PvpVersionCode="${{ inputs.version_code }}" \
            -PvpLiveUrl="$LIVE_URL" -PvpTestUrl="$TEST_URL" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Explain a failed build
        if: failure()
        run: |
          # Compile errors as annotations, so they show on the pull request without opening the log.
          grep -E "^e: |error:|\* What went wrong|^> " "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error title=Android build::$l"; done || true

      - name: Check the app file
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/${{ inputs.flavor }}/release/*.apk | head -1)
          mkdir -p dist
          cp "$src" "dist/${{ steps.meta.outputs.apk }}"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          badging=$("$bt/aapt2" dump badging "dist/${{ steps.meta.outputs.apk }}")
          pkg=$(echo "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          label=$(echo "$badging" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          echo "::notice title=App file::${{ steps.meta.outputs.apk }} · $label · $pkg · version $name ($code) · $(du -h "dist/${{ steps.meta.outputs.apk }}" | cut -f1)"
          [ "$pkg" = "${{ steps.meta.outputs.package }}" ] || { echo "::error::Package is $pkg, expected ${{ steps.meta.outputs.package }}"; exit 1; }
          [ "$name" = "${{ inputs.version_name }}" ] && [ "$code" = "${{ inputs.version_code }}" ] || { echo "::error::Version is $name ($code), expected ${{ inputs.version_name }} (${{ inputs.version_code }})"; exit 1; }
          [ "$label" = "${{ steps.meta.outputs.label }}" ] || { echo "::error::App name is $label, expected ${{ steps.meta.outputs.label }}"; exit 1; }
          certs=$("$bt/apksigner" verify --print-certs "dist/${{ steps.meta.outputs.apk }}")
          sha1=$(echo "$certs" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          sha256=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          echo "::notice title=Signing key fingerprints (add the SHA-1 in Firebase)::SHA-1 $sha1 · SHA-256 $sha256"
          echo "sha1=$sha1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: dist/${{ steps.meta.outputs.apk }}
          retention-days: 30

      - name: Allow the emulator to use KVM
        if: inputs.smoke_test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android emulator
        if: inputs.smoke_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/smoke.sh "dist/${{ steps.meta.outputs.apk }}" "${{ steps.meta.outputs.package }}" "$(echo '${{ steps.meta.outputs.url }}' | sed -E 's#^https?://##;s#/.*##')" smoke

      - uses: actions/upload-artifact@v4
        if: always() && inputs.smoke_test
        with:
          name: smoke-test-${{ inputs.flavor }}-${{ inputs.version_name }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: dist/${{ steps.meta.outputs.apk }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "${{ inputs.create_release }}" = "true" ]; then
            notes="Test app for the staging website (${{ steps.meta.outputs.url }}). Version ${{ inputs.version_name }}, built from ${GITHUB_SHA::7}."
            [ "$SIGNED" = "true" ] || notes="$notes

          **Signed with a temporary key** (the real signing key isn't set up yet): uninstall the previous test app before installing this one."
            gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" --title "VisionPay Test ${{ inputs.version_name }}" --notes "$notes"
          else
            gh release upload "$TAG" "$APK" --clobber
          fi
          echo "::notice title=Published::$(gh release view "$TAG" --json url --jq .url)"

      - name: Keep only the 5 newest test apps
        if: inputs.tag != '' && inputs.flavor == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-test\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
